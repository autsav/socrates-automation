name: Trending Music Refresh Reminder

on:
  schedule:
    # Weekly reminder to update curated trending sounds
    - cron: '0 10 * * 1'   # Monday 10:00 UTC — start of week planning
  workflow_dispatch:        # Manual trigger

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check last update date
        id: check
        run: |
          LAST_UPDATE=$(grep -oP '"updated": "\K[^"]+' src/audio/trending_music.py || echo "never")
          echo "last_update=$LAST_UPDATE" >> $GITHUB_OUTPUT
          echo "Last curated update: $LAST_UPDATE"

      - name: Send reminder notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MESSAGE="📅 Weekly Trending Music Reminder\n\nLast update: ${{ steps.check.outputs.last_update }}\n\nAction: Review trending sounds on Instagram/TikTok for stoic/motivational niche, then update trending_music.py.\n\nInstructions: github.com/autsav/socrates-automation/blob/main/src/audio/trending_music.py"

          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=$MESSAGE" \
              -d "parse_mode=Markdown" || true
          fi

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST "$SLACK_WEBHOOK_URL" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"$MESSAGE\"}" || true
          fi

          echo "Reminder sent (or no backend configured)"
