name: Refresh Trending Music

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC — start of week, fresh tracks
  workflow_dispatch:        # Manual trigger anytime

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get ISO week key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache music tracks
        uses: actions/cache@v4
        with:
          path: audio/music
          key: music-${{ steps.week.outputs.week }}
          restore-keys: music-

      - name: Refresh trending music tracks
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          if [ -n "$PIXABAY_API_KEY" ]; then
            python download_music.py --refresh
          else
            echo "⚠️ PIXABAY_API_KEY not set — skipping music refresh"
            exit 0
          fi
