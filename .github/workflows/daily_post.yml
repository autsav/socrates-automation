name: Socrates Pipeline

on:
  schedule:
    # 3 posts/day — quality over quantity (2025 algo rewards quality)
    # Research (Buffer 9.6M posts): mornings 8-10am, evenings 6-9pm perform best
    - cron: '0 8 * * *'    # 08:00 UTC — morning scroll (commute) — regular
    - cron: '0 15 * * *'   # 15:00 UTC — afternoon — POV Reel
    - cron: '0 18 * * *'   # 18:00 UTC — evening wind-down (peak) — regular

    # CAROUSEL posts — Wed + Thu only (highest engagement days per 2026 data)
    # Carousels get 1.92% vs 0.50% engagement, 3x more saves — use on best days
    - cron: '30 9 * * 3'   # Wednesday 09:30 UTC — carousel
    - cron: '30 9 * * 4'   # Thursday  09:30 UTC — carousel
  workflow_dispatch:  # Manual trigger from GitHub UI
  pull_request:       # Safety check on every PR

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate required secrets
        run: |
          missing=""
          for key in ANTHROPIC_API_KEY FAL_API_KEY META_ACCESS_TOKEN IG_ACCOUNT_ID CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            val="${!key}"
            if [ -z "$val" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "❌ MISSING REQUIRED SECRETS:$missing"
            echo "   → https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✅ All required secrets present"
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_API_KEY:            ${{ secrets.FAL_API_KEY }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID:          ${{ secrets.IG_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:     ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:  ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg (for Reel video generation)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Set up Node (for Remotion render)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Remotion deps
        run: npm --prefix remotion ci

      - name: Generate ambient audio tracks
        run: python generate_audio.py

      - name: Create output dirs
        run: mkdir -p output logs audio/music

      - name: Get ISO week key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache music tracks
        uses: actions/cache@v4
        with:
          path: audio/music
          key: music-${{ steps.week.outputs.week }}
          restore-keys: music-

      - name: Verify tracked SQLite database present
        run: |
          if [ ! -f "data/pipeline.db" ]; then
            echo "❌ data/pipeline.db missing after checkout — it must be committed to the repo (spec A2). Refusing to continue on an empty DB."
            exit 1
          fi
          echo "✅ pipeline.db present from repo ($(du -h data/pipeline.db | cut -f1))"

      - name: Init/migrate SQLite database
        run: python -c "from src.core.data_store import init_db; init_db()"

      - name: Detect post format (reel vs carousel vs pov)
        id: format
        run: |
          # Carousel runs at :30 past the hour (Wed/Thu 09:30).
          # Of the 3 daily on-the-hour slots, 15:00 is POV text Reel
          # (zero-cost) and 08:00/18:00 are regular FLUX Reels.
          MINUTE=$(date -u +%M)
          HOUR=$(date -u +%H)
          DAY=$(date -u +%u)  # 1=Mon … 7=Sun
          if [ "$MINUTE" = "30" ] && { [ "$DAY" = "3" ] || [ "$DAY" = "4" ]; }; then
            echo "mode=carousel" >> $GITHUB_OUTPUT
          elif [ "$HOUR" = "15" ]; then
            echo "mode=pov" >> $GITHUB_OUTPUT
          else
            echo "mode=reel" >> $GITHUB_OUTPUT
          fi
          echo "Detected mode: $(cat $GITHUB_OUTPUT | grep mode | cut -d= -f2)"

      - name: Run pipeline (dry-run on PRs, manual+Telegram on schedule)
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_API_KEY:            ${{ secrets.FAL_API_KEY }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_ID:            ${{ secrets.META_APP_ID }}
          META_APP_SECRET:        ${{ secrets.META_APP_SECRET }}
          IG_ACCOUNT_ID:          ${{ secrets.IG_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:     ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:  ${{ secrets.CLOUDINARY_API_SECRET }}
          JAMENDO_CLIENT_ID:      ${{ secrets.JAMENDO_CLIENT_ID }}
          GNEWS_API_KEY:          ${{ secrets.GNEWS_API_KEY }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
          ELEVENLABS_API_KEY:     ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
          TELEGRAM_BOT_TOKEN:     ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:       ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL:      ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🔍 PR dry-run"
            python pipeline.py --dry-run
          elif [ "${{ steps.format.outputs.mode }}" = "carousel" ]; then
            echo "📸 Auto-posting CAROUSEL (Wed/Thu — highest engagement day)"
            python pipeline.py --carousel
          elif [ "${{ steps.format.outputs.mode }}" = "pov" ]; then
            echo "🎬 POV Reel (Remotion) → Telegram for manual upload with trending audio"
            python pipeline.py --manual --remotion
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🎬 MANUAL TRIGGER — AI Creative Studio → Telegram for manual upload"
            python pipeline.py --studio --manual --remotion
          else
            echo "📲 SCHEDULED — AI Creative Studio → Telegram for MANUAL upload with trending music"
            python pipeline.py --studio --manual --remotion
          fi

      - name: Send post notification (Telegram/Slack)
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_API_KEY:            ${{ secrets.FAL_API_KEY }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID:          ${{ secrets.IG_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:     ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:  ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] || [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "📨 Sending post notification..."
            python -m src.core.notifier --latest || echo "Notification skipped (no recent post)"
          else
            echo "ℹ️ No notification backend configured — check logs/notifications.jsonl"
          fi

      - name: Commit SQLite database + logs back to repo
        if: github.event_name != 'pull_request'
        run: |
          python -c "import sqlite3; c=sqlite3.connect('data/pipeline.db'); c.execute(\"DELETE FROM token_state WHERE service='meta'\"); c.commit(); c.close()"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Force-add because data/ and logs/ are in .gitignore
          git add -f data/pipeline.db
          git add -f logs/notifications.jsonl 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update pipeline.db + logs [skip ci]"
          # NOTE: GitHub Actions default GITHUB_TOKEN may not have write access.
          # If this fails with 403, go to Settings → Actions → Workflow permissions
          # and select "Read and write permissions".
          git push || echo "⚠️ git push failed — see comment above"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated image as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-image-${{ github.run_number }}
          path: output/*.jpg
          retention-days: 30

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
