name: Socrates Pipeline

on:
  schedule:
    # REEL posts — 3x daily every day at peak engagement windows
    # Research (Buffer 9.6M posts): mornings 8-10am, evenings 6-9pm perform best
    - cron: '0 8 * * *'    # 08:00 UTC — morning scroll (commute)
    - cron: '0 12 * * *'   # 12:00 UTC — lunch break
    - cron: '0 18 * * *'   # 18:00 UTC — evening wind-down (peak)

    # CAROUSEL posts — Wed + Thu only (highest engagement days per 2026 data)
    # Carousels get 1.92% vs 0.50% engagement, 3x more saves — use on best days
    - cron: '30 9 * * 3'   # Wednesday 09:30 UTC — carousel
    - cron: '30 9 * * 4'   # Thursday  09:30 UTC — carousel
  workflow_dispatch:  # Manual trigger from GitHub UI
  pull_request:       # Safety check on every PR

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install ffmpeg (for Reel video generation)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate ambient audio tracks
        run: python generate_audio.py

      - name: Create output dirs
        run: mkdir -p output logs audio/music

      - name: Download royalty-free music tracks
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          if [ -n "$PIXABAY_API_KEY" ]; then
            python download_music.py
          else
            echo "⚠️ PIXABAY_API_KEY not set — using generated audio fallback"
          fi

      - name: Init SQLite database
        run: python -c "from data_store import init_db; init_db()"

      - name: Restore SQLite database from repo
        run: |
          if [ -f "data/pipeline.db" ]; then
            echo "✅ Restored pipeline.db from repo ($(du -h data/pipeline.db | cut -f1))"
          else
            echo "🆕 No existing database — fresh start"
            mkdir -p data
          fi

      - name: Detect post format (reel vs carousel)
        id: format
        run: |
          # Carousel runs at :30 past the hour (Wed/Thu 09:30)
          # Reels run on the hour (08:00, 12:00, 18:00)
          MINUTE=$(date -u +%M)
          DAY=$(date -u +%u)  # 1=Mon … 7=Sun
          if [ "$MINUTE" = "30" ] && { [ "$DAY" = "3" ] || [ "$DAY" = "4" ]; }; then
            echo "mode=carousel" >> $GITHUB_OUTPUT
          else
            echo "mode=reel" >> $GITHUB_OUTPUT
          fi
          echo "Detected mode: $(cat $GITHUB_OUTPUT | grep mode | cut -d= -f2)"

      - name: Run pipeline (dry-run on PRs)
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_API_KEY:            ${{ secrets.FAL_API_KEY }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}
          META_APP_ID:            ${{ secrets.META_APP_ID }}
          META_APP_SECRET:        ${{ secrets.META_APP_SECRET }}
          IG_ACCOUNT_ID:          ${{ secrets.IG_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:     ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:  ${{ secrets.CLOUDINARY_API_SECRET }}
          PIXABAY_API_KEY:        ${{ secrets.PIXABAY_API_KEY }}
          OPENAI_API_KEY:         ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "🔍 PR dry-run"
            python pipeline.py --dry-run
          elif [ "${{ steps.format.outputs.mode }}" = "carousel" ]; then
            echo "📸 Posting CAROUSEL (Wed/Thu — highest engagement day)"
            python pipeline.py --carousel
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "🎬 MANUAL TRIGGER — AI Creative Studio → Telegram proposal for manual upload (test)"
            python pipeline.py --studio --manual
          else
            echo "📲 SCHEDULED — AI Creative Studio proposal → Telegram for MANUAL upload with trending music (auto-falls back to legacy templates if the studio fails)"
            python pipeline.py --studio --manual
          fi

      - name: Send post notification (Telegram/Slack)
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] || [ -n "$SLACK_WEBHOOK_URL" ]; then
            echo "📨 Sending post notification..."
            python notifier.py --latest || echo "Notification skipped (no recent post)"
          else
            echo "ℹ️ No notification backend configured — check logs/notifications.jsonl"
          fi

      - name: Commit SQLite database + logs back to repo
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pipeline.db logs/
          git diff --staged --quiet || git commit -m "chore: update pipeline.db + logs [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated image as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-image-${{ github.run_number }}
          path: output/*.jpg
          retention-days: 30

      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ github.run_number }}
          path: logs/
          retention-days: 30
