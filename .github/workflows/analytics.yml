name: Socrates Analytics

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC — morning after posts have accumulated overnight metrics
  workflow_dispatch:        # Manual trigger from GitHub UI
  pull_request:             # Safety check on every PR

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate required secrets
        run: |
          missing=""
          for key in ANTHROPIC_API_KEY FAL_API_KEY META_ACCESS_TOKEN IG_ACCOUNT_ID CLOUDINARY_CLOUD_NAME CLOUDINARY_API_KEY CLOUDINARY_API_SECRET; do
            val="${!key}"
            if [ -z "$val" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "❌ MISSING REQUIRED SECRETS:$missing"
            echo "   → https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          echo "✅ All required secrets present"
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_API_KEY:            ${{ secrets.FAL_API_KEY }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID:          ${{ secrets.IG_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:     ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:  ${{ secrets.CLOUDINARY_API_SECRET }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore pipeline DB from cache
        uses: actions/cache/restore@v4
        with:
          path: data/pipeline.db
          key: pipeline-db-${{ github.run_id }}
          restore-keys: pipeline-db-
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Create output dirs
        run: mkdir -p output logs

      - name: Reconcile manual posts (backfill real post_id)
        if: github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_API_KEY:            ${{ secrets.FAL_API_KEY }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID:          ${{ secrets.IG_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:     ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:  ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python -m studio.reconcile || echo "Reconcile skipped/failed (non-blocking)"

      - name: Run analytics (dry-run on PRs)
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_API_KEY:            ${{ secrets.FAL_API_KEY }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID:          ${{ secrets.IG_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:     ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:  ${{ secrets.CLOUDINARY_API_SECRET }}
          META_APP_ID:            ${{ secrets.META_APP_ID }}
          META_APP_SECRET:        ${{ secrets.META_APP_SECRET }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m src.analytics.metrics --dry-run
          else
            python -m src.analytics.metrics
          fi

      - name: Re-poll 7-day window
        if: github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_API_KEY:            ${{ secrets.FAL_API_KEY }}
          META_ACCESS_TOKEN:      ${{ secrets.META_ACCESS_TOKEN }}
          IG_ACCOUNT_ID:          ${{ secrets.IG_ACCOUNT_ID }}
          CLOUDINARY_CLOUD_NAME:  ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY:     ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET:  ${{ secrets.CLOUDINARY_API_SECRET }}
          META_APP_ID:            ${{ secrets.META_APP_ID }}
          META_APP_SECRET:        ${{ secrets.META_APP_SECRET }}
        run: python -c "from src.analytics.metrics import ingest_window; import os; print(ingest_window(os.environ['META_ACCESS_TOKEN'], os.environ['IG_ACCOUNT_ID'], 'data/pipeline.db'))"

      - name: Self-improving loop — apply approvals, then propose
        if: github.event_name != 'pull_request'
        env:
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Act on any approve/reject taps from the previous cycle, then propose
          # fresh prompt improvements. Both are best-effort — never fail the job.
          python optimize.py --apply-decisions || echo "apply-decisions skipped/failed (non-blocking)"
          python optimize.py --run || echo "optimizer run skipped/failed (non-blocking)"

      - name: Optimizer dry-run (PR safety check)
        if: github.event_name == 'pull_request'
        run: python optimize.py --dry-run || echo "optimizer dry-run failed (non-blocking)"

      - name: Scrub token from DB
        if: github.event_name != 'pull_request'
        run: python -c "import sqlite3; c=sqlite3.connect('data/pipeline.db'); c.execute(\"DELETE FROM token_state\"); c.commit(); c.close()"

      - name: Save pipeline DB to cache
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: data/pipeline.db
          key: pipeline-db-${{ github.run_id }}
      - name: Upload logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-analytics-${{ github.run_number }}
          path: logs/
          retention-days: 30
